[project]
name = "subconverter-py"
version = "0.1.0"
description = "Utility to convert between various proxy subscription formats (Python port)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "waitress>=3.0",
    "toml>=0.10",
]
license = "GPL-3.0"
readme = "README.md"

[project.scripts]
subconverter = "subconverter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subconverter"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
